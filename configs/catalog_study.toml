schema_version = 1

[run]
purpose = "reference"
seeds = [20000, 20001, 20002, 20003, 20004, 20005, 20006, 20007, 20008, 20009, 20010, 20011, 20012, 20013, 20014, 20015, 20016, 20017, 20018, 20019, 20020, 20021, 20022, 20023, 20024, 20025, 20026, 20027, 20028, 20029, 20030, 20031, 20032, 20033, 20034, 20035, 20036, 20037, 20038, 20039, 20040, 20041, 20042, 20043, 20044, 20045, 20046, 20047, 20048, 20049, 20050, 20051, 20052, 20053, 20054, 20055, 20056, 20057, 20058, 20059, 20060, 20061, 20062, 20063]
methods = ["rct_t_ridge", "obs_t_ridge", "naive_pooled_t_ridge", "rct_t_extra_trees", "obs_t_extra_trees", "naive_pooled_t_extra_trees", "rct_dr_ridge", "rct_dr_extra_trees", "datafusionppi", "cornet_official"]
reference_method = "rct_dr_extra_trees"
scope = "prespecified full catalog study; 31 canonical presets, 4 OBS/RCT budget pairs, 64 independent sample seeds, fixed public recipes; explicit adapter applicability and heavy-tail inference limits"

[method_options.rct_t_ridge]
ridge_alpha = 1.0

[method_options.obs_t_ridge]
ridge_alpha = 1.0

[method_options.naive_pooled_t_ridge]
ridge_alpha = 1.0

[method_options.rct_t_extra_trees]
n_estimators = 100
min_samples_leaf = 5

[method_options.obs_t_extra_trees]
n_estimators = 100
min_samples_leaf = 5

[method_options.naive_pooled_t_extra_trees]
n_estimators = 100
min_samples_leaf = 5

[method_options.rct_dr_ridge]
ridge_alpha = 1.0

[method_options.rct_dr_extra_trees]
n_estimators = 100
min_samples_leaf = 5

[method_options.datafusionppi]
learner = "DR"
covariate_shift = true

[method_options.cornet_official]
source_epochs = 500
correction_epochs = 200
width = 25
standardize = true
learning_rate = 0.1
outcome_penalty = 0.1
correction_penalty = 0.0

