schema_version = 1

[run]
purpose = "reference"
seeds = [70000, 70001, 70002, 70003, 70004, 70005, 70006, 70007, 70008, 70009, 70010, 70011, 70012, 70013, 70014, 70015, 70016, 70017, 70018, 70019, 70020, 70021, 70022, 70023, 70024, 70025, 70026, 70027, 70028, 70029, 70030, 70031, 70032, 70033, 70034, 70035, 70036, 70037, 70038, 70039, 70040, 70041, 70042, 70043, 70044, 70045, 70046, 70047, 70048, 70049, 70050, 70051, 70052, 70053, 70054, 70055, 70056, 70057, 70058, 70059, 70060, 70061, 70062, 70063]
methods = ["rct_selected", "rct_t_ridge", "integrative_r_linear", "integrative_r_quadratic", "rct_causal_forest"]
reference_method = "rct_selected"
scope = "v1 core wave 2 (docs/V1_CORE_WAVE2.md), group native_r: Integrative R (linear, quadratic) and the grf causal forest; same presets, budgets and seeds as wave 1; each shard refits rct_selected and rct_t_ridge"

[method_options.rct_selected]
ridge_alpha = 1.0
n_estimators = 100
min_samples_leaf = 5

[method_options.rct_t_ridge]
ridge_alpha = 1.0

[method_options.integrative_r_linear]
k_folds = 5
timeout_seconds = 1200

[method_options.integrative_r_quadratic]
k_folds = 5
timeout_seconds = 1200

[method_options.rct_causal_forest]
num_trees = 2000
num_threads = 1
timeout_seconds = 600

