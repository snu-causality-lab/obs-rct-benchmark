reference_method = "rct_selected"
scope = "selected-rho Causal-ICM addendum (docs/V1_ICM_SELECTED.md), stress block: the 64 stress conditions and seeds in the gp environment; each shard refits rct_selected, rct_t_ridge, causal_icm_fixed and causal_icm_rct_only"

[method_options.rct_selected]
ridge_alpha = 1.0
n_estimators = 100
min_samples_leaf = 5

[method_options.rct_t_ridge]
ridge_alpha = 1.0

[method_options.causal_icm_fixed]
rho = 0.5

[method_options.causal_icm_rct_only]
rho = 0.5

