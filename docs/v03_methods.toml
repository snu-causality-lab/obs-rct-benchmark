schema_version = 1
literature_cutoff = "2026-10-26"
checked_at = "2026-10-27"
status = "inventory_with_partial_native_admission_and_fixed_gp_pilot"
understood_as = "Track source-backed method-by-target-by-assumption comparisons and their observed implementation readiness; this inventory is not an execution authorization."
canonical_scope = "Inventory and scientific disposition only; executable pins stay in sources.lock.toml."
machine_status_semantics = "Status fields are descriptive annotations, not executable enums. Disposition values are defined in status_vocabulary; this inventory is not an execution configuration."
verification_scope = "Primary papers and official GitHub metadata/README/API documentation were read at the literature cutoff. Subsequent native admission covers three fixed recipes; the fixed GP source-access pilot ran 576 fits. Other revisions remain candidate references, not dependency admission; per-method status and linked evidence define scope."
revision_query = "https://api.github.com/repos/{owner}/{repo}/commits?until=2026-10-26T14:59:59Z&per_page=1"
pending_is_not_na = true
code_redistributed = false
v03_runtime_status = "Three native recipes have bounded cost and reproduction checks; the fixed GP and two source controls completed a 576-fit development pilot. See V03_ADAPTERS.md and results/gp_source_pilot. Broader campaign pending."

[status_vocabulary]
paper_verified = "Primary source consulted; not a theorem-by-theorem independent review."
code_verified = "Official repository/archive and stated entrypoint or README inspected; not executed."
adapter_exists = "Public benchmark adapter exists; this alone proves neither execution nor source-paper reproduction."
catalog_executed = "Fixed v0.2 recipe ran; results and failures are preserved."
planned_core = "Scientifically selected for preparation, subject to target mapping, native-example/scientific checks, environment/license review and cost review."
planned_core_with_explicit_model_target = "Planned core preparation with a declared structural effect model and prediction map; misspecification is reported separately."
retained_controls = "Existing reference recipes retained for continuity and diagnostics; not sufficient by themselves as strong RCT comparators."
planned_native_target = "Prepare the native estimand; a common CATE comparison requires an explicit equivalence or declared adaptation."
extension = "Separate target or action contract; excluded from the primary common-CATE ranking by design, not by code availability."
pending = "Unresolved engineering, source, license or reproduction work; never scientific not-applicable."

