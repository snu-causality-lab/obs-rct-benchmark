[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obs-rct-benchmark"
version = "0.2.0a1"
description = "Role-separated simulation benchmark for observational and randomized CATE learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
baselines = ["scikit-learn>=1.3,<2"]
cornet = ["torch>=2,<3", "scikit-learn>=1.3,<2"]
datafusionppi = ["dfppi @ git+https://github.com/CausalDataScience/DataFusionPPI.git@04c7f3447b02fa09f875e68e8c47100a7207d546"]
test = ["pytest>=8,<10", "scikit-learn>=1.3,<2"]
analysis = ["scipy>=1.11,<2", "matplotlib>=3.8,<4"]
notebooks = ["matplotlib>=3.8,<4", "jupyterlab>=4,<5", "nbclient>=0.10,<0.11", "nbformat>=5.10,<6", "ipykernel>=6,<8"]

[project.scripts]
obs-rct-benchmark = "obs_rct_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
