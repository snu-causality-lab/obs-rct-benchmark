name: Core benchmark checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[baselines,test]'
      - run: python scripts/check_release.py
      - run: python -m pytest
      - run: obs-rct-benchmark run --config configs/smoke.toml --output outputs/ci-smoke
      - run: obs-rct-benchmark run --config configs/gamma_smoke.toml --output outputs/ci-gamma
      - run: python examples/run_synthetic_file_smoke.py --output outputs/ci-file-fixtures
